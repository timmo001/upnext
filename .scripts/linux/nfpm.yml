---
name: upnext
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
release: "1"
section: utils
priority: optional
maintainer: Aidan Timson <aidan@timmo.dev>
description: Twitch live channels, YouTube uploads and a watch-later queue in one feed
homepage: https://github.com/timmo001/upnext
license: Apache-2.0
overrides:
  deb:
    depends:
      - libc6
  rpm:
    depends:
      - glibc
contents:
  - src: dist/release/root/upnext
    dst: /usr/bin/upnext
    file_info:
      mode: 0755
  - src: .scripts/linux/upnext.service
    dst: /usr/lib/systemd/user/upnext.service
  - src: .scripts/linux/completions/upnext.bash
    dst: /usr/share/bash-completion/completions/upnext
  - src: .scripts/linux/completions/upnext.fish
    dst: /usr/share/fish/vendor_completions.d/upnext.fish
  - src: .scripts/linux/completions/_upnext
    dst: /usr/share/zsh/site-functions/_upnext
  - src: LICENSE
    dst: /usr/share/licenses/upnext/LICENSE
