---
name: Docs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/index.ts"
      - "scripts/generate-cli-reference.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/index.ts"
      - "scripts/generate-cli-reference.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/check-docs.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      generated-paths: |
        docs/src/content/docs/commands
        docs/commands-sidebar.json
      extra-checks: cd docs && bun run --parallel --no-exit-on-error check validate
