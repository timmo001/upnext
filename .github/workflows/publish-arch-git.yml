---
name: Publish Arch git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - packages/**
      - package.json
      - bun.lock
      - mise.toml
      - LICENSE
      - .scripts/linux/PKGBUILD
      - .scripts/linux/upnext.install
      - .scripts/linux/upnext.service
      - .scripts/linux/upnext.svg
      - .github/workflows/publish-arch-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (upnext-git)
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0
    with:
      package-name: upnext-git
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
